_base_: [
  configs/dataloader/OES/oesfull.yaml,
]

trainer:
  type: DetTrainer
  max_epochs: 1
  gather_train_stats: False
  gather_test_stats: True

algorithm:
  type: VOS
  
sample_number: 1000
feature_dim: 2048
sample_from: 10000
select: 1
loss_weight: 0.1
start_epoch: 0
model:
  type: ResNet_Base
  network:
    type: ResNet18
    num_classes: 94
  checkpoint: ./output/ood/det_oes_rn18_msp/train/latest.pth
  loss: CrossEntropyLoss
  
criterion:
  type: CrossEntropyLoss

optimizer:
  type: SGD
  lr: 0.01
  weight_decay: 0.0001

scheduler:
  type: cosine
  T_max: 100  

seed: 0
device: cuda
CIL: False

exp_name: train
work_dir: ./output/ood/det_oes_rn18_vos
