_base_: [
  configs/dataloader/OES/ood/oesfull.yaml,
]

trainer:
  type: DetTrainer
  max_epochs: 1
  gather_train_stats: False
  gather_test_stats: True

algorithm:
  type: MSP

model:
  type: ResNet_Base
  network:
    type: ResNet18
    num_classes: 94
  checkpoint: ./output/ood/det_oes_rn18_msp/train/latest.pth
  loss: LogitNormLoss
  
criterion:
  type: LogitNormLoss

optimizer:
  type: SGD
  lr: 0.01
  weight_decay: 0.0001

scheduler:
  type: cosine
  T_max: 100  

seed: 0
device: cuda
CIL: False

exp_name: train
work_dir: ./output/ood/det_oes_rn18_logitnorm