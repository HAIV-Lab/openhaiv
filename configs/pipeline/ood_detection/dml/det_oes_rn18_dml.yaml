_base_: [
  configs/dataloader/OES/ood/oesfull.yaml,
]

trainer:
  type: DetTrainer
  max_epochs: 0
  gather_train_stats: False
  gather_test_stats: True

algorithm:
  type: DML

model:
  type: DMLNet
  network:
    type: ResNet18
    num_classes: 94
  loss: dml
  checkpoint_C: output/ood/det_oes_rn18_dml_cosine/train/latest.pth 
  checkpoint_N: output/ood/det_oes_rn18_dml_norm/train/latest.pth

criterion:
  type: CrossEntropyLoss

optimizer:
  type: Adam
  lr: 0.0003
  weight_decay: 0.0001

scheduler:
  type: Constant

seed: 0
device: cuda
CIL: False

exp_name: test
work_dir: ./output/ood/det_oes_rn18_dml
