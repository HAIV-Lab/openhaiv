_base_: [
  configs/algorithms/incremental/lwf.yaml,
  configs/models/lwf.yaml,
]

trainer:
  type: IncTrainer
  sess_cfg:
    s0:
      _base_: configs/dataloader/OES/inc/s0.yaml
      trainer:
        max_epochs: 1
    s1:
      _base_: configs/dataloader/OES/inc/s1.yaml
      trainer:
        max_epochs: 1
    s2:
      _base_: configs/dataloader/OES/inc/s2.yaml
      trainer:
        max_epochs: 1
    s3:
      _base_: configs/dataloader/OES/inc/s3.yaml
      trainer:
        max_epochs: 1
    s4:
      _base_: configs/dataloader/OES/inc/s4.yaml
      trainer:
        max_epochs: 1
    s5:
      _base_: configs/dataloader/OES/inc/s5.yaml
      trainer:
        max_epochs: 1
    s6:
      _base_: configs/dataloader/OES/inc/s6.yaml
      trainer:
        max_epochs: 1
    s7:
      _base_: configs/dataloader/OES/inc/s7.yaml
      trainer:
        max_epochs: 1
    s8:
      _base_: configs/dataloader/OES/inc/s8.yaml
      trainer:
        max_epochs: 1
    s9:
      _base_: configs/dataloader/OES/inc/s9.yaml
      trainer:
        max_epochs: 1
algorithm:
  type: lwf

criterion:
  type: CrossEntropyLoss

optimizer:
  type: sgd
  lr: 0.05
  weight_decay: 0.0001

scheduler:
  type: cosine
  T_max: 100  

seed: 0
device: cuda

exp_name: exp
work_dir: ./output/inc/inc_oes_lwf
