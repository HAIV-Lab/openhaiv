_base_: configs/dataloader/loader.yaml

trainloader:
  dataset:
    type: OES_OOD
    root: /new_data/datasets/OES/sub-dataset1-RGB-domain1/ID/train/
    split: train
    download: True
    transform:
      random_resized_crop:
        size: 224
      random_horizontal_flip:
        p: 0.5
      to_tensor: null
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

valloader:
  dataset:
    type: OES_OOD
    root: /new_data/datasets/OES/sub-dataset1-RGB-domain1/ID/test/
    split: val
    download: True
    transform:
      resize:
        size: 256
      center_crop:
        size: 224
      to_tensor: null
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
testloader:
  dataset:
    type: OES_OOD
    root: /new_data/datasets/OES/sub-dataset1-RGB-domain1/ID/test/
    split: val
    download: True
    transform:
      resize:
        size: 256
      center_crop:
        size: 224
      to_tensor: null
      normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
